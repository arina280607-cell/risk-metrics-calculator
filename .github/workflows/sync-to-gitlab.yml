name: Sync to GitLab MAI

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitlab-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get the current GitHub branch and its history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Push this branch to GitLab MAI
        shell: bash
        env:
          GITLAB_SYNC_TOKEN: ${{ secrets.GITLAB_SYNC_TOKEN }}
          LC_ALL: C
        run: |
          set -euo pipefail

          case "$GITHUB_REF_NAME" in
            main|develop) ;;
            *) echo "Unsupported branch" >&2; exit 1 ;;
          esac

          if [[ -z "${GITLAB_SYNC_TOKEN:-}" ]]; then
            echo "The GITLAB_SYNC_TOKEN repository secret is missing." >&2
            exit 1
          fi

          git -c http.sslVerify=false push \
            "https://oauth2:${GITLAB_SYNC_TOKEN}@gitlab.mai.ru/ArAKozlova/risk-metrics-calculator.git" \
            "HEAD:refs/heads/$GITHUB_REF_NAME"
